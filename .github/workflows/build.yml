name: Build patched MoltenVK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a Release on version tags

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same as MoltenVK's own CI: Python 3.12 removed distutils, which fetchDependencies uses.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache MoltenVK dependencies
        uses: actions/cache@v4
        with:
          path: build/MoltenVK/External
          key: mvk-external-${{ runner.os }}-${{ hashFiles('scripts/build.sh') }}

      - name: Build
        run: scripts/build.sh

      - name: Package
        run: |
          mkdir -p release
          cp dist/libMoltenVK.dylib dist/SHA256SUMS scripts/install.sh README.md LICENSE NOTICE release/
          cp -R patches release/
          (cd release && zip -r ../enshrouded-mac-perfmod.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: enshrouded-mac-perfmod
          path: enshrouded-mac-perfmod.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: enshrouded-mac-perfmod.zip
          generate_release_notes: true
